<svg	xmlns="http://www.w3.org/2000/svg"
		width="1200" height="360"
		viewBox="0 0 1200 360"
		preserveAspectRatio="xMidYMid meet">

	<defs>
		<linearGradient id="background"
						x1="0" y1="0" x2="1" y2="1">
		<stop offset="0%" stop-color="#0D1117"/>
		<stop offset="100%" stop-color="#101923"/>
		</linearGradient>
	</defs>

	<!-- Background -->
	<rect	width="1200" height="360"
			rx="24" fill="#0D1117"/>

	<!-- Accent -->
	<rect	x="25" y="30" width="4" height="300"
			rx="2.5" fill="#2DD4BF" opacity = "0.8"/>

	<!-- Heading -->
	<text	x="75" y="93"
			font-family="monospace"
			font-size="24"
			font-weight="600"
			letter-spacing="4"
			fill="#5EEAD4">42 · COMMON CORE
	</text>

	<text	x="72" y="166"
			font-family="sans-serif"
			font-size="72"
			font-weight="700"
			fill="#F0F6FC">PUSH_SWAP
	</text>

	<text	x="76" y="211"
			font-family="sans-serif"
			font-size="23"
			letter-spacing="1"
			fill="#CBD5E1">SORTING · STACKS · OPTIMIZATION
	</text>

	<rect	x="76" y="238" width="128" height="4"
			rx="2" fill="#2DD4BF"/>

	<text	x="76" y="274"
			font-family="monospace"
			font-size="17"
			letter-spacing="3"
			fill="#5EEAD4">ALGORITHMIC CHALLENGE
	</text>

	<!-- Stack A -->
	<g	transform="translate(790 91)">
		<text	x="43" y="-14"
				text-anchor="middle"
				font-family="sans-serif"
				font-size="19"
				fill="#94A3B8">STACK A
		</text>

		<rect	x="0" y="0" width="86" height="39"
				rx="7" fill="#2DD4BF"/>
		<rect	x="0" y="48" width="86" height="39"
				rx="7" fill="#164E63" stroke="#2DD4BF" stroke-width="2"/>
		<rect	x="0" y="96" width="86" height="39"
				rx="7" fill="#164E63" stroke="#2DD4BF" stroke-width="2"/>
		<rect	x="0" y="144" width="86" height="39"
				rx="7" fill="#164E63" stroke="#2DD4BF" stroke-width="2"/>

		<g	font-family="sans-serif"
			font-size="20" text-anchor="middle" font-weight="600">
			<text x="43" y="26" fill="#0D1117">3</text>
			<text x="43" y="74" fill="#CCFBF1">1</text>
			<text x="43" y="122" fill="#CCFBF1">4</text>
			<text x="43" y="170" fill="#CCFBF1">2</text>
		</g>
	</g>

	<!-- Push direction -->
	<path
		d="M 900 182 H 930 M 920 173 L 930 182 L 920 191"
		fill="none"
		stroke="#2DD4BF"
		stroke-width="4"
		stroke-linecap="round"
		stroke-linejoin="round"
	/>
	<!-- Stack B -->
	<g	transform="translate(955 91)">
		<text	x="43" y="-14"
				text-anchor="middle"
				font-family="sans-serif"
				font-size="19"
				fill="#94A3B8">STACK B
		</text>

		<rect	x="0" y="0" width="86" height="39"
				rx="7" fill="#1C2735" stroke="#64748B" stroke-width="2"/>
		<rect	x="0" y="48" width="86" height="39"
				rx="7" fill="#1C2735" stroke="#64748B" stroke-width="2"/>
		<rect	x="0" y="96" width="86" height="39"
				rx="7" fill="#1C2735" stroke="#64748B" stroke-width="2"/>

		<g	font-family="sans-serif"
			font-size="20" text-anchor="middle" font-weight="600">
			<text x="43" y="26" fill="#CBD5E1">5</text>
			<text x="43" y="74" fill="#CBD5E1">6</text>
			<text x="43" y="122" fill="#CBD5E1">7</text>
		</g>
	</g>
</svg>
